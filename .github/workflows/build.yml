name: Build and publish image

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'deploy/entrypoint.sh'
      - 'deploy/healthcheck.py'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<version>)[^<]+' src/detector/package.xml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure this version isn't already published
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/rollout-loop:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "::error::$IMAGE is already published. Bump <version> in src/detector/package.xml before pushing."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rollout-loop:${{ steps.version.outputs.version }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: Report image size
        run: |
          docker image inspect ghcr.io/${{ github.repository_owner }}/rollout-loop:${{ steps.version.outputs.version }} \
            --format '{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1024/1024}' >> "$GITHUB_STEP_SUMMARY"
